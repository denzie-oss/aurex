services:
  db:
    image: postgres:16-alpine
    container_name: aurex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aurex
      POSTGRES_USER: aurex
      POSTGRES_PASSWORD: aurex_local_password
    ports:
      - "5432:5432"
    volumes:
      - aurex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurex -d aurex"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  aurex_pgdata:
